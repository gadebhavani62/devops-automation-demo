
name: DevOps Automation CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devops-demo-deploy
  cancel-in-progress: false

jobs:
  ci-cd:
    name: Test Build Push Deploy
    runs-on: [self-hosted, Linux, X64]

    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/devops-automation-demo
      CONTAINER_NAME: devops-demo

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Python unit tests
        run: python3 -m unittest discover -v

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:${GITHUB_SHA}" \
            -t "$IMAGE_NAME:latest" .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"

      - name: Deploy application
        run: |
          docker rm -f "$CONTAINER_NAME" || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 127.0.0.1:8080:8080 \
            "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Verify application health
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              echo "Application deployed successfully!"
              exit 0
            fi
            sleep 2
          done

          echo "Deployment health check failed"
          docker logs "$CONTAINER_NAME"
          exit 1

      - name: Display deployment information
        run: |
          docker ps --filter "name=$CONTAINER_NAME"
          echo "Image deployed: $IMAGE_NAME:${GITHUB_SHA}"
